<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>Hometown Harvest Map</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif;background:#1a1a2e;height:100vh;overflow:hidden;user-select:none;}
  .topbar{background:#0e2056;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:8px;border-bottom:2px solid #c49a3e;}
  .topbar-title{font-size:14px;font-weight:700;color:#fff;}
  .topbar-btns{display:flex;gap:6px;}
  .tbtn{padding:6px 11px;border-radius:5px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;font-size:11.5px;font-weight:600;cursor:pointer;}
  .tbtn.on{background:#c49a3e;border-color:#c49a3e;color:#0e2056;}
  .main{display:flex;flex-direction:column;height:calc(100vh - 52px);}
  .catbar{background:#142f7e;padding:8px 10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid rgba(255,255,255,.1);}
  .catbar::-webkit-scrollbar{display:none;}
  .cat{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:20px;border:1.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);color:rgba(255,255,255,.7);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;}
  .cat.on{background:var(--cc);border-color:var(--cc);color:#fff;}
  .cdot{width:9px;height:9px;border-radius:2px;background:var(--cc);flex-shrink:0;}
  .cat.on .cdot{background:rgba(255,255,255,.5);}
  .map-wrap{flex:1;position:relative;overflow:hidden;touch-action:none;}
  #mapSvg{position:absolute;top:0;left:0;width:100%;height:100%;}
  .bot{background:#0e2056;border-top:1px solid rgba(255,255,255,.1);padding:8px 14px;display:flex;align-items:center;justify-content:space-between;}
  .bot-count{font-size:11.5px;color:rgba(255,255,255,.5);}
  .bot-hint{font-size:11px;color:rgba(255,255,255,.35);font-style:italic;}
  .mbg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:1000;}
  .mbg.on{display:flex;}
  .mbox{background:#fff;border-radius:16px 16px 0 0;padding:22px 18px 36px;width:100%;max-width:480px;}
  .mbox h3{font-size:17px;font-weight:700;color:#0e2056;margin-bottom:16px;}
  .fg{display:flex;flex-direction:column;gap:5px;margin-bottom:13px;}
  .fg label{font-size:12px;font-weight:600;color:#6f7d99;}
  .fg input,.fg select{padding:12px 13px;border:1.5px solid #dbe3f4;border-radius:8px;font-size:15px;font-family:inherit;width:100%;-webkit-appearance:none;appearance:none;}
  .fg input:focus,.fg select:focus{outline:none;border-color:#1a3ea8;}
  .mbtns{display:flex;gap:8px;margin-top:16px;}
  .mb{flex:1;padding:13px;border-radius:8px;border:none;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;}
  .mb.pri{background:#1a3ea8;color:#fff;}
  .mb.sec{background:#f3f6fc;color:#0e2056;}
  .mb.del{background:#fbe9e9;color:#b3261e;}
  .lsheet{background:#fff;border-radius:16px 16px 0 0;width:100%;max-height:60vh;overflow-y:auto;padding-bottom:32px;}
  .lhdr{padding:14px 18px;font-size:13px;font-weight:700;color:#0e2056;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between;align-items:center;}
  .litem{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid #f8f8f8;cursor:pointer;}
  .ldot{width:11px;height:11px;border-radius:3px;flex-shrink:0;}
  .lname{flex:1;font-size:14px;color:#0e2056;font-weight:600;}
  .lcat{font-size:11px;color:#6f7d99;}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-title">🌽 Harvest Map Editor</div>
  <div class="topbar-btns">
    <button class="tbtn" id="modeBtn" onclick="toggleMode()">✥ Move</button>
    <button class="tbtn" onclick="showList()">List</button>
    <button class="tbtn" onclick="exportSVG()">Export</button>
  </div>
</div>

<div class="main">
  <div class="catbar" id="catbar"></div>
  <div class="map-wrap" id="mapWrap">
    <svg id="mapSvg" viewBox="0 0 700 600" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
      <rect width="700" height="600" fill="#e4e8f4"/>
      <rect x="0" y="0" width="700" height="78" fill="#cdd3e8"/>
      <rect x="0" y="522" width="700" height="78" fill="#cdd3e8"/>
      <rect x="0" y="0" width="78" height="600" fill="#cdd3e8"/>
      <rect x="622" y="0" width="78" height="600" fill="#cdd3e8"/>
      <line x1="0" y1="39" x2="700" y2="39" stroke="#b0bcd8" stroke-width="1.2" stroke-dasharray="12,9"/>
      <line x1="0" y1="561" x2="700" y2="561" stroke="#b0bcd8" stroke-width="1.2" stroke-dasharray="12,9"/>
      <line x1="39" y1="0" x2="39" y2="600" stroke="#b0bcd8" stroke-width="1.2" stroke-dasharray="12,9"/>
      <line x1="661" y1="0" x2="661" y2="600" stroke="#b0bcd8" stroke-width="1.2" stroke-dasharray="12,9"/>
      <text x="350" y="27" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4470" letter-spacing=".6">S Jefferson St</text>
      <text x="350" y="553" text-anchor="middle" font-size="14" font-weight="700" fill="#3a4470" letter-spacing=".6">S Main St</text>
      <text x="39" y="305" text-anchor="middle" font-size="13" font-weight="700" fill="#3a4470" transform="rotate(-90,39,305)">E 3rd St</text>
      <text x="661" y="305" text-anchor="middle" font-size="13" font-weight="700" fill="#3a4470" transform="rotate(90,661,305)">E 4th St</text>
      <rect x="78" y="78" width="544" height="444" fill="#bfd4a0" rx="3"/>
      <rect x="78" y="78" width="544" height="444" fill="none" stroke="#90b060" stroke-width="2.5"/>
      <rect x="80" y="80" width="540" height="30" fill="#a8bcd8" rx="2" opacity=".4"/>
      <rect x="80" y="490" width="540" height="30" fill="#a8bcd8" rx="2" opacity=".4"/>
      <rect x="80" y="80" width="30" height="440" fill="#a8bcd8" rx="2" opacity=".4"/>
      <rect x="590" y="80" width="30" height="440" fill="#a8bcd8" rx="2" opacity=".4"/>
      <line x1="110" y1="110" x2="308" y2="278" stroke="#ddd4a8" stroke-width="14" stroke-linecap="round"/>
      <line x1="590" y1="110" x2="392" y2="278" stroke="#ddd4a8" stroke-width="14" stroke-linecap="round"/>
      <line x1="110" y1="490" x2="308" y2="322" stroke="#ddd4a8" stroke-width="14" stroke-linecap="round"/>
      <line x1="590" y1="490" x2="392" y2="322" stroke="#ddd4a8" stroke-width="14" stroke-linecap="round"/>
      <line x1="350" y1="110" x2="350" y2="234" stroke="#ddd4a8" stroke-width="12" stroke-linecap="round"/>
      <line x1="350" y1="366" x2="350" y2="490" stroke="#ddd4a8" stroke-width="12" stroke-linecap="round"/>
      <line x1="110" y1="300" x2="234" y2="300" stroke="#ddd4a8" stroke-width="12" stroke-linecap="round"/>
      <line x1="466" y1="300" x2="590" y2="300" stroke="#ddd4a8" stroke-width="12" stroke-linecap="round"/>
      <rect x="228" y="224" width="194" height="152" fill="#c4baa8" rx="4" stroke="#9a9080" stroke-width="2"/>
      <rect x="244" y="236" width="162" height="128" fill="#b8ae9c" rx="2"/>
      <ellipse cx="325" cy="295" rx="26" ry="20" fill="#aaa090" stroke="#9a9080" stroke-width="1"/>
      <text x="325" y="299" text-anchor="middle" font-size="10" font-weight="700" fill="#5a5040">COURTHOUSE</text>
      <g fill="#6aaa44" opacity=".72">
        <circle cx="130" cy="140" r="20"/><circle cx="168" cy="122" r="15"/><circle cx="148" cy="172" r="13"/>
        <circle cx="570" cy="140" r="20"/><circle cx="532" cy="122" r="15"/><circle cx="552" cy="172" r="13"/>
        <circle cx="130" cy="460" r="20"/><circle cx="168" cy="478" r="15"/><circle cx="148" cy="428" r="13"/>
        <circle cx="570" cy="460" r="20"/><circle cx="532" cy="478" r="15"/><circle cx="552" cy="428" r="13"/>
        <circle cx="210" cy="158" r="11"/><circle cx="490" cy="158" r="11"/>
        <circle cx="210" cy="442" r="11"/><circle cx="490" cy="442" r="11"/>
        <circle cx="570" cy="300" r="13"/><circle cx="130" cy="300" r="13"/>
      </g>
      <g transform="translate(648,102)">
        <circle r="22" fill="white" stroke="#1a3ea8" stroke-width="1.5"/>
        <text y="-7" text-anchor="middle" font-size="12" font-weight="800" fill="#1a3ea8">N</text>
        <polygon points="0,-16 4.5,-4 0,-8 -4.5,-4" fill="#1a3ea8"/>
      </g>
      <g id="markerLayer"></g>
    </svg>
  </div>
  <div class="bot">
    <span class="bot-count" id="botCount">0 markers</span>
    <span class="bot-hint" id="botHint">Tap map to place a marker</span>
  </div>
</div>

<!-- ADD -->
<div class="mbg" id="addM"><div class="mbox">
  <h3>Place Marker</h3>
  <div class="fg"><label>Label</label><input id="aLabel" type="text" placeholder="e.g. Gazebo, Vendor #1, Stage…" autocomplete="off"/></div>
  <div class="fg"><label>Category</label><select id="aCat"></select></div>
  <div class="fg"><label>Notes (optional)</label><input id="aNotes" type="text" placeholder="Any extra details…" autocomplete="off"/></div>
  <div class="mbtns">
    <button class="mb sec" onclick="closeAdd()">Cancel</button>
    <button class="mb pri" onclick="confirmAdd()">Place It</button>
  </div>
</div></div>

<!-- EDIT -->
<div class="mbg" id="editM"><div class="mbox">
  <h3>Edit Marker</h3>
  <div class="fg"><label>Label</label><input id="eLabel" type="text" autocomplete="off"/></div>
  <div class="fg"><label>Category</label><select id="eCat"></select></div>
  <div class="fg"><label>Notes (optional)</label><input id="eNotes" type="text" autocomplete="off"/></div>
  <div class="mbtns">
    <button class="mb del" onclick="delMarker()">Delete</button>
    <button class="mb sec" onclick="closeEdit()">Cancel</button>
    <button class="mb pri" onclick="confirmEdit()">Save</button>
  </div>
</div></div>

<!-- LIST -->
<div class="mbg" id="listM"><div class="lsheet">
  <div class="lhdr"><span>All Markers</span><button onclick="closeList()" style="background:none;border:none;font-size:22px;color:#aaa;cursor:pointer;">×</button></div>
  <div id="listItems"></div>
</div></div>

<script>
var CATS=[
  {id:'vendor',  label:'Vendor Booth',      color:'#c49a3e'},
  {id:'food',    label:'Food Truck',         color:'#e05c2a'},
  {id:'stage',   label:'Stage / Music',      color:'#1a3ea8'},
  {id:'gazebo',  label:'Gazebo / Structure', color:'#9a8850'},
  {id:'parking', label:'Parking',            color:'#6f7d99'},
  {id:'info',    label:'Info / Restrooms',   color:'#2eaa6e'},
  {id:'parade',  label:'Parade Route',       color:'#9b3dc8'},
  {id:'custom',  label:'Custom',             color:'#444444'}
];

var MODE='add', ACT='vendor';
var markers=[], nid=1, pendX=0, pendY=0, editId=null;
var drg=null, dox=0, doy=0, dmoved=false;

/* load */
try{var ss=localStorage.getItem('hh26');if(ss){var dd=JSON.parse(ss);markers=dd.m||[];nid=dd.n||1;ACT=dd.a||'vendor';}}catch(e){}

/* build UI */
(function(){
  var opts=CATS.map(function(c){return '<option value="'+c.id+'">'+c.label+'</option>';}).join('');
  document.getElementById('aCat').innerHTML=opts;
  document.getElementById('eCat').innerHTML=opts;
  var bar=document.getElementById('catbar');
  bar.innerHTML=CATS.map(function(c){
    return '<button class="cat'+(c.id===ACT?' on':'')+'" id="cb-'+c.id+'" style="--cc:'+c.color+'" onclick="setAct(\''+c.id+'\')">'
      +'<span class="cdot" style="--cc:'+c.color+'"></span>'+c.label+'</button>';
  }).join('');
  renderAll(); upd();
})();

function save(){try{localStorage.setItem('hh26',JSON.stringify({m:markers,n:nid,a:ACT}));}catch(e){}}

function setAct(id){
  ACT=id;
  CATS.forEach(function(c){var el=document.getElementById('cb-'+c.id);if(el)el.className='cat'+(c.id===id?' on':'');});
  document.getElementById('aCat').value=id;
  save();
}

function toggleMode(){
  MODE=MODE==='add'?'drag':'add';
  var b=document.getElementById('modeBtn'),h=document.getElementById('botHint');
  if(MODE==='drag'){b.classList.add('on');b.textContent='+ Add';h.textContent='Drag markers to move them';}
  else{b.classList.remove('on');b.textContent='✥ Move';h.textContent='Tap map to place a marker';}
}

/* coords */
function toSVG(cx,cy){
  var svg=document.getElementById('mapSvg');
  var r=svg.getBoundingClientRect();
  var vb=svg.viewBox.baseVal;
  return {x:(cx-r.left)*(vb.width/r.width),y:(cy-r.top)*(vb.height/r.height)};
}

/* touch on map */
document.getElementById('mapWrap').addEventListener('touchstart',function(e){
  var t=e.touches[0];
  /* check marker hit */
  var el=document.elementFromPoint(t.clientX,t.clientY);
  var mg=el&&el.closest('[data-mid]');
  if(mg){
    var mid=parseInt(mg.dataset.mid);
    if(MODE==='drag'){startDrag(e,mid);}
    else{openEdit(mid);}
    return;
  }
  if(MODE!=='add')return;
  var p=toSVG(t.clientX,t.clientY);
  pendX=p.x; pendY=p.y;
  document.getElementById('aCat').value=ACT;
  document.getElementById('aLabel').value='';
  document.getElementById('aNotes').value='';
  document.getElementById('addM').classList.add('on');
  setTimeout(function(){document.getElementById('aLabel').focus();},80);
},{passive:true});

function startDrag(e,id){
  drg=id; dmoved=false;
  var m=markers.find(function(x){return x.id===id;});
  var t=e.touches[0];
  var p=toSVG(t.clientX,t.clientY);
  dox=p.x-m.x; doy=p.y-m.y;
  var wrap=document.getElementById('mapWrap');
  function mv(ev){
    ev.preventDefault(); dmoved=true;
    var tt=ev.touches[0];
    var pp=toSVG(tt.clientX,tt.clientY);
    m.x=pp.x-dox; m.y=pp.y-doy;
    var g=document.getElementById('mg'+id);
    if(g)g.setAttribute('transform','translate('+m.x+','+m.y+')');
  }
  function up(){
    wrap.removeEventListener('touchmove',mv);
    wrap.removeEventListener('touchend',up);
    save(); drg=null;
    if(!dmoved)openEdit(id);
  }
  wrap.addEventListener('touchmove',mv,{passive:false});
  wrap.addEventListener('touchend',up,{passive:true});
}

function confirmAdd(){
  var lbl=document.getElementById('aLabel').value.trim()||'Marker';
  markers.push({id:nid++,x:pendX,y:pendY,label:lbl,cat:document.getElementById('aCat').value,notes:document.getElementById('aNotes').value.trim()});
  save(); renderAll(); upd(); closeAdd();
}
function closeAdd(){document.getElementById('addM').classList.remove('on');}

function openEdit(id){
  var m=markers.find(function(x){return x.id===id;});
  if(!m)return;
  editId=id;
  document.getElementById('eLabel').value=m.label;
  document.getElementById('eCat').value=m.cat;
  document.getElementById('eNotes').value=m.notes||'';
  document.getElementById('editM').classList.add('on');
}
function confirmEdit(){
  var m=markers.find(function(x){return x.id===editId;});
  if(!m)return;
  m.label=document.getElementById('eLabel').value.trim()||m.label;
  m.cat=document.getElementById('eCat').value;
  m.notes=document.getElementById('eNotes').value.trim();
  save(); renderAll(); upd(); closeEdit();
}
function delMarker(){markers=markers.filter(function(x){return x.id!==editId;});save();renderAll();upd();closeEdit();}
function closeEdit(){document.getElementById('editM').classList.remove('on');}

function showList(){
  var items=document.getElementById('listItems');
  if(!markers.length){items.innerHTML='<div style="padding:24px;text-align:center;color:#aaa;font-size:14px;">No markers placed yet.</div>';document.getElementById('listM').classList.add('on');return;}
  items.innerHTML=markers.map(function(m){
    var c=CATS.find(function(x){return x.id===m.cat;})||CATS[0];
    return '<div class="litem" onclick="closeList();openEdit('+m.id+')">'
      +'<span class="ldot" style="background:'+c.color+'"></span>'
      +'<span class="lname">'+esc(m.label)+'</span>'
      +'<span class="lcat">'+c.label+'</span>'
      +'</div>';
  }).join('');
  document.getElementById('listM').classList.add('on');
}
function closeList(){document.getElementById('listM').classList.remove('on');}

function renderAll(){
  var layer=document.getElementById('markerLayer');
  layer.innerHTML='';
  var ns='http://www.w3.org/2000/svg';
  markers.forEach(function(m){
    var cat=CATS.find(function(c){return c.id===m.cat;})||CATS[0];
    var g=document.createElementNS(ns,'g');
    g.setAttribute('id','mg'+m.id);
    g.setAttribute('data-mid',m.id);
    g.setAttribute('transform','translate('+m.x+','+m.y+')');
    /* shadow */
    var sh=document.createElementNS(ns,'ellipse');
    sh.setAttribute('cx','0');sh.setAttribute('cy','22');sh.setAttribute('rx','10');sh.setAttribute('ry','4');
    sh.setAttribute('fill','rgba(0,0,0,0.2)');g.appendChild(sh);
    /* pin */
    var pin=document.createElementNS(ns,'path');
    pin.setAttribute('d','M0,-30 C-14,-30 -21,-19 -21,-11 C-21,4 0,24 0,24 C0,24 21,4 21,-11 C21,-19 14,-30 0,-30 Z');
    pin.setAttribute('fill',cat.color);pin.setAttribute('stroke','rgba(255,255,255,.45)');pin.setAttribute('stroke-width','1.5');
    g.appendChild(pin);
    /* inner */
    var inn=document.createElementNS(ns,'circle');
    inn.setAttribute('cy','-11');inn.setAttribute('r','9');inn.setAttribute('fill','rgba(255,255,255,0.7)');
    g.appendChild(inn);
    /* label bg */
    var w=m.label.length*5.8+12;
    var bg=document.createElementNS(ns,'rect');
    bg.setAttribute('x',(-(w/2)).toFixed(1));bg.setAttribute('y','26');
    bg.setAttribute('width',w.toFixed(1));bg.setAttribute('height','15');
    bg.setAttribute('rx','3');bg.setAttribute('fill','rgba(255,255,255,0.9)');
    g.appendChild(bg);
    /* label */
    var txt=document.createElementNS(ns,'text');
    txt.setAttribute('y','37');txt.setAttribute('text-anchor','middle');
    txt.setAttribute('font-size','9.5');txt.setAttribute('font-weight','700');txt.setAttribute('fill',cat.color);
    txt.textContent=m.label;
    g.appendChild(txt);
    layer.appendChild(g);
  });
}

function upd(){
  document.getElementById('botCount').textContent=markers.length+' marker'+(markers.length===1?'':'s');
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function exportSVG(){
  var s=new XMLSerializer().serializeToString(document.getElementById('mapSvg'));
  var a=document.createElement('a');
  a.href='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
  a.download='hometown-harvest-map.svg';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
}

['addM','editM','listM'].forEach(function(id){
  document.getElementById(id).addEventListener('click',function(e){
    if(e.target===this)this.classList.remove('on');
  });
});
</script>
</body>
</html>
