name: Hobart Happenings social worker

# Looks at the community calendar twice a day and schedules the next day's five Facebook posts for
# anything that is due. Posts go into the Page's "Scheduled" queue (Meta Business
# Suite) so they can be reviewed or deleted before they go live.
on:
  schedule:
    - cron: '15 12 * * *'   # ~7:15 AM Central
    - cron: '15 0 * * *'    # ~7:15 PM Central
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Make drafts only (do not touch Facebook)'
        type: boolean
        default: true
      now:
        description: 'Pretend it is this Central time, e.g. 2026-11-12T08:30 (testing)'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: social-worker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: social
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: social/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Run the worker
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_MODE: ${{ vars.FB_MODE }}
          IS_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          DRY_RUN: ${{ inputs.dry_run }}
          PRETEND_NOW: ${{ inputs.now }}
        run: |
          ARGS=""
          if [ "$IS_MANUAL" = "true" ] && [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "$PRETEND_NOW" ]; then ARGS="$ARGS --now $PRETEND_NOW"; fi
          node src/run.js $ARGS | tee "$GITHUB_STEP_SUMMARY"

      - name: Keep the drafts so they can be looked at
        uses: actions/upload-artifact@v4
        with:
          name: drafts
          path: social/out/drafts
          if-no-files-found: ignore
          retention-days: 14

      - name: Save the ledger (so nothing ever posts twice)
        run: |
          if ! git diff --quiet -- state/ledger.json; then
            git config user.name "Hobart Happenings worker"
            git config user.email "actions@users.noreply.github.com"
            git add state/ledger.json
            git commit -m "social worker: update ledger [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
