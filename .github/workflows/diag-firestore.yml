name: Temporary Firestore read check
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Which collections can the public read? (status codes and counts only)
        run: |
          B="https://firestore.googleapis.com/v1/projects/hobart-chamber/databases/(default)/documents"
          for p in botw_archive settings/banner settings/botw jobs deals events; do
            code=$(curl -s -o /tmp/r.json -w "%{http_code}" "$B/$p?pageSize=50")
            n=$(python3 -c "import json;d=json.load(open('/tmp/r.json'));print(len(d.get('documents',[])) if 'documents' in d else ('doc' if 'fields' in d else d.get('error',{}).get('status','-')))" 2>/dev/null)
            echo "GET $p -> $code ($n)"
          done
          code=$(curl -s -o /tmp/q.json -w "%{http_code}" -X POST -H 'content-type: application/json' "$B:runQuery" -d '{"structuredQuery":{"from":[{"collectionId":"botw_archive"}],"limit":50}}')
          n=$(python3 -c "import json;d=json.load(open('/tmp/q.json'));print(sum(1 for r in d if 'document' in r) if isinstance(d,list) else d)" 2>/dev/null)
          echo "QUERY botw_archive -> $code ($n docs)"
          python3 -c "import json;d=json.load(open('/tmp/q.json'));print('fields:', sorted({k for r in d if 'document' in r for k in r['document'].get('fields',{})}) if isinstance(d,list) else '-')" 2>/dev/null
